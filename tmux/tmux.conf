# ~/.config/tmux/tmux.conf
# Prefix-free tmux: everything you use daily is Alt+key (one chord, two hands).
# Press Alt-? inside tmux for the cheat sheet.  Reload with: prefix r  (Ctrl-Space r)

# ── Core ──────────────────────────────────────────────────────────────────────
set -g  default-shell   /usr/bin/fish          # login shell stays bash; tmux panes use fish
set -g  default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:usstyle:hyperlinks:extkeys:strikethrough:overline:sync"
set -s  extended-keys   on
set -s  escape-time     0                      # no lag after Esc (matters in nvim)
set -s  focus-events    on
set -s  set-clipboard   on                     # OSC 52: copy works even over ssh
set -s  copy-command    "wl-copy"              # ...and straight to the Wayland clipboard
set -g  allow-passthrough on                   # kitty image protocol etc.
set -g  mouse           on
set -g  history-limit   50000
set -g  base-index      1                      # windows start at 1 (matches Alt-1..9)
setw -g pane-base-index 1
set -g  renumber-windows on
set -g  detach-on-destroy off                  # closing a session drops you in another, not out of tmux
set -g  display-time    2000
set -g  status-interval 5
setw -g aggressive-resize on
setw -g mode-keys       vi
set -g  status-keys     emacs
set -g  set-titles      on
set -g  set-titles-string "#S · #W"
setw -g monitor-activity on
set -g  visual-activity off
# Window name = running program, or the folder name when sitting at a fish prompt
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{==:#{pane_current_command},fish},#{b:pane_current_path},#{pane_current_command}}"

# ── Prefix (fallback only, for rarely used stock bindings) ───────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# ── Panes ─────────────────────────────────────────────────────────────────────
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 3
bind -n M-K resize-pane -U 3
bind -n M-L resize-pane -R 5
bind -n 'M-\' split-window -h -c "#{pane_current_path}"   # side by side
bind -n M--   split-window -v -c "#{pane_current_path}"   # stacked
# Alt-Enter: halve the current pane along its longer side (spiral / dwindle tiling)
bind -n M-Enter if -F "#{e|>:#{e|*:#{pane_width},2},#{e|*:#{pane_height},5}}" {
    split-window -h -c "#{pane_current_path}"
} {
    split-window -v -c "#{pane_current_path}"
}
bind -n M-z resize-pane -Z                               # zoom / unzoom
bind -n M-x kill-pane
bind -n M-= next-layout                                   # cycle layouts
bind -n M-y setw synchronize-panes                        # type in all panes at once

# ── Windows ───────────────────────────────────────────────────────────────────
bind -n M-n new-window -c "#{pane_current_path}"
bind -n M-i previous-window
bind -n M-o next-window
bind -n M-a last-window                                   # toggle between two windows
bind -n M-< swap-window -d -t -1
bind -n M-> swap-window -d -t +1
bind -n M-r command-prompt -I "#W" "rename-window -- '%%'"
bind -n M-X confirm-before -p "kill window #W? (y/n)" kill-window
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# ── Sessions ──────────────────────────────────────────────────────────────────
bind -n M-g display-popup -E -w 70% -h 70% -T " jump to session / project " "~/.config/tmux/scripts/sessionizer"
bind -n M-w choose-tree -Zs                               # visual overview of everything
bind -n M-q switch-client -l                              # toggle between two sessions
bind -n M-( switch-client -p
bind -n M-) switch-client -n
bind -n M-R command-prompt -I "#S" "rename-session -- '%%'"

# ── Popups ────────────────────────────────────────────────────────────────────
# Alt-t: floating scratch terminal that keeps its state; Alt-t again hides it
bind -n M-t if -F "#{==:#{session_name},scratch}" {
    detach-client
} {
    display-popup -E -w 80% -h 75% -d "#{pane_current_path}" "tmux new-session -A -s scratch \\; set status off"
}
bind -n M-G display-popup -E -w 92% -h 92% -d "#{pane_current_path}" "lazygit"
bind -n M-? display-popup -E -w 90% -h 90% -T " tmux guide (q to close, / to search) " "less -R ~/.config/tmux/GUIDE.md"

# ── Copy mode (vi keys) ───────────────────────────────────────────────────────
bind -n M-v copy-mode
bind -n M-/ { copy-mode ; send-keys ? }                   # search scrollback straight away
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel
bind -T copy-mode-vi [   send -X previous-prompt          # jump between shell prompts
bind -T copy-mode-vi ]   send -X next-prompt
bind -T copy-mode-vi Escape send -X cancel

# ── F12: switch all tmux keys off (for tmux inside ssh, or apps that need Alt) ─
bind -T root F12 { set prefix None ; set key-table off ; set -g @keys_off 1 ; refresh-client -S }
bind -T off  F12 { set -u prefix ; set -u key-table ; set -g @keys_off 0 ; refresh-client -S }

# ── Theme ─────────────────────────────────────────────────────────────────────
# Material "deep ocean" — the exact colours nvim (material.nvim + lualine) uses,
# hard-coded so tmux matches nvim whatever the kitty theme is. Needs a Nerd Font.
set -g status-position top
set -g status-justify  left
set -g status-style    "bg=#0f111a,fg=#a6accd"
set -g status-left-length  40
set -g status-right-length 80

# session pill follows lualine modes: cyan normally, red while the prefix is held, purple in copy mode
set -g @accent "#{?client_prefix,#f07178,#{?pane_in_mode,#c792ea,#84ffff}}"
set -g status-left "#[fg=#{E:@accent}]#[fg=#0f111a,bg=#{E:@accent},bold] #S#[fg=#{E:@accent},bg=default,nobold] "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#464b5d] #I #[fg=#a6accd]#W#{?window_activity_flag,#[fg=#ffcb6b] ●,} "
setw -g window-status-current-format "#[fg=#1f2233]#[fg=#84ffff,bg=#1f2233,bold]#I #W#{?window_zoomed_flag, ,}#[fg=#1f2233,bg=default,nobold]"
setw -g window-status-activity-style "none"

set -g status-right "#{?@keys_off,#[fg=#f07178#,bold]KEYS OFF (F12) #[default],}#{?pane_synchronized,#[fg=#ffcb6b#,bold]SYNC #[default],}#[fg=#464b5d] #[fg=#a6accd]#{b:pane_current_path}  #[fg=#464b5d] #[fg=#a6accd]%H:%M "

set -g pane-border-style        "fg=#232637"
set -g pane-active-border-style "fg=#84ffff"
set -g pane-border-lines        single
set -g popup-border-lines       rounded
set -g popup-border-style       "fg=#84ffff"
set -g message-style            "bg=#0f111a,fg=#ffcb6b"
set -g message-command-style    "bg=#0f111a,fg=#ffcb6b"
setw -g mode-style              "bg=#1f2233,fg=#eeffff"
setw -g clock-mode-colour       "#84ffff"

# pane contents: nvim's Normal background/foreground, Search colours, and the
# same 16-colour palette nvim gives its own terminal
set -g  window-style                  "bg=#0f111a,fg=#a6accd"
set -g  popup-style                   "bg=#0f111a,fg=#a6accd"
setw -g copy-mode-match-style         "bg=#eeffff,fg=#0f111a"
setw -g copy-mode-current-match-style "bg=#84ffff,fg=#0f111a,bold"
set -g  pane-colours[0] "#000000"
set -g  pane-colours[1] "#dc6068"
set -g  pane-colours[2] "#abcf76"
set -g  pane-colours[3] "#e6b455"
set -g  pane-colours[4] "#6e98eb"
set -g  pane-colours[5] "#b480d6"
set -g  pane-colours[6] "#71c6e7"
set -g  pane-colours[7] "#eeffff"
set -g  pane-colours[8] "#464b5d"
set -g  pane-colours[9] "#f07178"
set -g  pane-colours[10] "#c3e88d"
set -g  pane-colours[11] "#ffcb6b"
set -g  pane-colours[12] "#82aaff"
set -g  pane-colours[13] "#c792ea"
set -g  pane-colours[14] "#89ddff"
set -g  pane-colours[15] "#eeffff"

# ── Plugins (prefix I installs, prefix U updates) ─────────────────────────────
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-resurrect"     # save/restore sessions across reboots
set -g @plugin "tmux-plugins/tmux-continuum"     # ...automatically, every 15 min
set -g @resurrect-capture-pane-contents "on"
set -g @resurrect-strategy-nvim "session"
set -g @continuum-restore "on"
set -g @continuum-save-interval "15"

if "test -x ~/.config/tmux/plugins/tpm/tpm" "run ~/.config/tmux/plugins/tpm/tpm"
